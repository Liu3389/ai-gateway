# ============================================
# AI模型调度网关与流式对话平台 - 应用配置文件
# ============================================
# 本配置文件包含以下主要配置模块：
# 1. 服务器配置 (server)
# 2. Spring框架配置 (spring)
# 3. MyBatis-Plus ORM框架配置 (mybatis-plus)
# 4. OpenAI API集成配置 (openai)
# 5. 限流策略配置 (rate-limit)
# 6. 计费系统配置 (billing)
# 7. 日志系统配置 (logging)
# 8. 监控端点配置 (management)
# ============================================

# ============================================
# 服务器配置
# ============================================
server:
  # 服务端口号，设置为8080
  port: 8080
  servlet:
    # 上下文路径，所有API请求都需要在URL前加上/api前缀
    # 例如：http://localhost:8080/api/auth/login
    context-path: /api

# ============================================
# Spring框架配置
# ============================================
spring:
  application:
    # 应用名称，用于服务标识和日志记录
    name: ai-gateway-platform
  
  # ============================================
  # 数据源配置（MySQL数据库连接）
  # ============================================
  datasource:
    # MySQL JDBC驱动类名
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接URL
    # 10.211.55.10:3306 - 数据库服务器地址和端口
    # ai_gateway - 数据库名称
    # useUnicode=true&characterEncoding=utf8 - 使用UTF-8字符编码
    # useSSL=false - 禁用SSL连接（生产环境建议启用）
    # serverTimezone=Asia/Shanghai - 设置时区为上海时间
    # allowPublicKeyRetrieval=true - 允许公钥检索（用于RSA加密连接）
    url: jdbc:mysql://10.211.55.10:3306/ai_gateway?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 数据库用户名
    username: root
    # 数据库密码（生产环境建议使用环境变量或密钥管理服务）
    password: 123456
    # HikariCP连接池配置（高性能JDBC连接池）
    hikari:
      # 最大连接池大小，控制并发数据库连接数
      maximum-pool-size: 20
      # 最小空闲连接数，保持一定数量的空闲连接以提高响应速度
      minimum-idle: 5
      # 连接超时时间（毫秒），获取连接的最大等待时间
      connection-timeout: 30000
      # 空闲连接超时时间（毫秒），空闲连接被回收前的最大等待时间
      idle-timeout: 600000
      # 连接最大生命周期（毫秒），超过此时间的连接将被强制关闭
      max-lifetime: 1800000

  # ============================================
  # Redis缓存配置
  # ============================================
  data:
    redis:
      # Redis服务器主机地址
      host: 10.211.55.10
      # Redis服务器端口号
      port: 6379
      # Redis访问密码（生产环境建议使用环境变量）
      password: 123321
      # 使用的Redis数据库编号（0-15，默认使用0号数据库）
      database: 0
      # 连接超时时间
      timeout: 3000ms
      # Lettuce客户端连接池配置（Lettuce是Spring Data Redis的默认客户端）
      lettuce:
        pool:
          # 连接池最大活跃连接数
          max-active: 20
          # 连接池最大阻塞等待时间（-1表示无限制）
          max-wait: -1ms
          # 连接池最大空闲连接数
          max-idle: 10
          # 连接池最小空闲连接数
          min-idle: 5

# ============================================
# MyBatis-Plus ORM框架配置
# ============================================
mybatis-plus:
  # Mapper XML文件位置，支持通配符匹配多个路径
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类包路径，用于类型别名扫描
  type-aliases-package: com.ai.gateway.entity
  # MyBatis配置
  configuration:
    # 开启下划线到驼峰命名的自动转换（如：user_name -> userName）
    map-underscore-to-camel-case: true
    # SQL日志实现，使用标准输出打印SQL语句（开发环境使用，生产环境建议关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # 全局配置
  global-config:
    db-config:
      # 主键生成策略，auto表示使用数据库自增主键
      id-type: auto
      # 逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑删除值（1表示已删除）
      logic-delete-value: 1
      # 逻辑未删除值（0表示未删除）
      logic-not-delete-value: 0

# ============================================
# OpenAI API集成配置
# ============================================
openai:
  # OpenAI Chat Completions API endpoint
  api-url: https://api.openai.com/v1/chat/completions
  # OpenAI API密钥（生产环境建议使用环境变量或密钥管理服务）
  api-key: sk-your-openai-api-key-here
  # 支持的模型配置
  models:
    # GPT-3.5 Turbo模型配置
    gpt-3.5-turbo:
      # 每1000 tokens的价格（美元）
      price-per-1k-tokens: 0.002
      # 最大token数量限制
      max-tokens: 4096
    # GPT-4o模型配置
    gpt-4o:
      # 每1000 tokens的价格（美元）
      price-per-1k-tokens: 0.01
      # 最大token数量限制
      max-tokens: 128000

# ============================================
# 限流策略配置
# ============================================
rate-limit:
  # 默认限流速率（每秒请求数）
  default-rate: 100
  # 限流Lua脚本位置，用于实现基于Redis的高性能限流算法
  lua-script: classpath:lua/rate_limit.lua

# ============================================
# 计费系统配置
# ============================================
billing:
  # 计费Lua脚本位置，用于实现原子性的余额扣减操作
  lua-script: classpath:lua/billing.lua
  # 预扣费比例系数（1.2表示预扣120%的费用，防止超额消费）
  pre-deduct-ratio: 1.2

# ============================================
# 日志系统配置
# ============================================
logging:
  level:
    # 设置com.ai.gateway包的日志级别为debug，便于开发调试
    com.ai.gateway: debug
    # 设置Mapper包的日志级别为debug，打印SQL执行详情
    com.ai.gateway.mapper: debug
  pattern:
    # 控制台日志输出格式
    # %d{yyyy-MM-dd HH:mm:ss} - 日期时间
    # [%thread] - 线程名
    # %-5level - 日志级别（左对齐，占5个字符）
    # %logger{50} - 日志记录器名称（最多50个字符）
    # %msg%n - 日志消息和换行符
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'

# ============================================
# Spring Boot Actuator监控端点配置
# ============================================
management:
  endpoints:
    web:
      exposure:
        # 暴露的监控端点列表
        # health - 健康检查端点
        # info - 应用信息端点
        # metrics - 性能指标端点
        include: health,info,metrics
