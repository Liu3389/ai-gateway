server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ai-gateway-platform
  
  # MySQL数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://10.211.55.10:3306/ai_gateway?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    
  # Redis配置
  data:
    redis:
      host: 10.211.55.10
      port: 6379
      password: 123321
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ai.gateway.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# OpenAI API配置
openai:
  api-url: https://api.openai.com/v1/chat/completions
  # 请替换为实际的OpenAI API Key
  api-key: sk-your-openai-api-key-here
  models:
    gpt-3.5-turbo:
      # 每千Token价格（美元）
      price-per-1k-tokens: 0.002
      max-tokens: 4096
    gpt-4o:
      price-per-1k-tokens: 0.01
      max-tokens: 128000

# 限流配置
rate-limit:
  # 默认每分钟请求限制
  default-rate: 100
  # Lua脚本路径
  lua-script: classpath:lua/rate_limit.lua

# 计费配置
billing:
  # Lua脚本路径
  lua-script: classpath:lua/billing.lua
  # 预扣余额比例（防止并发超扣）
  pre-deduct-ratio: 1.2

# 日志配置
logging:
  level:
    com.ai.gateway: debug
    com.ai.gateway.mapper: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
