server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ai-gateway-platform
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://10.211.55.10:3306/ai_gateway?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: 10.211.55.10
      port: 6379
      password: 123321
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: -1ms
          max-idle: 10
          min-idle: 5

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ai.gateway.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

openai:
  api-url: https://api.openai.com/v1/chat/completions
  api-key: sk-your-openai-api-key-here
  models:
    gpt-3.5-turbo:
      price-per-1k-tokens: 0.002
      max-tokens: 4096
    gpt-4o:
      price-per-1k-tokens: 0.01
      max-tokens: 128000

rate-limit:
  default-rate: 100
  lua-script: classpath:lua/rate_limit.lua

billing:
  lua-script: classpath:lua/billing.lua
  pre-deduct-ratio: 1.2

logging:
  level:
    com.ai.gateway: debug
    com.ai.gateway.mapper: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
